name: Build PDF Tools APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: pdf-tools-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    # Pin the runner to avoid surprise image migrations during a build.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Check project source
        run: npm test

      - name: Bundle app and local PDF libraries
        run: npm run build:web

      # The source ZIP may be uploaded over an older SEW7/ERP repository.
      # Recreate Android from this project's PDF Tools Capacitor config so stale
      # ERP package IDs, Gradle files, and native assets cannot break the build.
      - name: Recreate clean Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Apply PDF Tools launcher icons
        run: cp -R icons/mipmap-* android/app/src/main/res/

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PDF-Tools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
